name: ci
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    env: {MODEL_PROFILE: offline}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: gigbid-ci-only
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - run: python -m scripts.generate_data
      - name: Lint and static checks (no inline prompts, no hard-coded models, no secrets)
        run: make lint
      - name: Unit, contract and integration tests (MCP servers through an in-memory client)
        run: python -m pytest -q
      - name: Verify PostgreSQL crash recovery and exactly-once GigSim submission
        env:
          DATABASE_URL: postgresql+psycopg://postgres:gigbid-ci-only@127.0.0.1:5432/postgres
          GIGBID_DISPOSABLE_POSTGRES: "1"
          MCP_TRANSPORT: inprocess
          MARKETPLACE_MODE: gigsim
          GIGSIM_ERROR_RATE: "0"
        run: python -m scripts.verify_postgres_recovery
      - name: Smoke eval with failure thresholds
        run: python -m evals.runners.smoke --jobs 30
  web:
    runs-on: ubuntu-latest
    needs: python
    env: {MODEL_PROFILE: offline, GIGSIM_RATE_LIMIT: "300", MARKETPLACE_RPM: "240", GIGSIM_ERROR_RATE: "0", GIGSIM_EVENT_DELAY: "3"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: pip install -e . && python -m scripts.generate_data
      - name: API client is generated, not hand-written (fails if stale)
        run: |
          python -m scripts.export_openapi
          cd apps/web && npm ci && npm run gen:api && git diff --exit-code src/lib/api/schema.d.ts
      - run: cd apps/web && npm run typecheck && npm run build
      - name: Start the stack
        run: |
          nohup uvicorn gigsim.app:app --port 8081 > gigsim.log 2>&1 &
          nohup uvicorn apps.api.main:app --port 8000 > api.log 2>&1 &
          cd apps/web && nohup npm run start > ../../web.log 2>&1 &
          sleep 12 && curl -fs localhost:8000/api/healthz
      - run: cd apps/web && npx playwright install --with-deps chromium && npx playwright test
      - if: failure()
        run: tail -100 api.log
